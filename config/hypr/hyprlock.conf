background {
    monitor = eDP-1
    path = ~/.config/wallpapers/nordtest1.png
    blur_passes = 2
    blur_size = 7
    color = rgba(0,0,0,1.0)
}

input-field {
    monitor          = eDP-1
    size             = 300, 50
    position         = 0, -80
    halign           = center
    valign           = center
    placeholder_text = <i>Password</i>
    fail_text        = <b>Wrong password</b>
    capslock_color   = rgba(220, 163, 46, 1.0)
}

label {
    monitor     = eDP-1
    text        = $TIME
    font_size   = 64
    position    = 0, 80
    halign      = center
    valign      = center
}
