# ── Cursor & Selection Colours ───────────────────────────────────────────
[colors.cursor]
cursor = "#88c0d0"
text   = "#2e3440"

[colors.selection]
text       = "#d8dee9"
background = "#3b4252"

# ── Primary Colours ───────────────────────────────────────────────────────
[colors.primary]
background = "#2e3440"
foreground = "#d8dee9"

# ── Normal Palette (ANSI) ────────────────────────────────────────────────
[colors.normal]
black   = "#3b4252"
red     = "#bf616a"
green   = "#a3be8c"
yellow  = "#ebcb8b"
blue    = "#81a1c1"
magenta = "#b48ead"
cyan    = "#88c0d0"
white   = "#e5e9f0"

# ── Font Settings ────────────────────────────────────────────────────────
[font]
size = 11.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style  = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style  = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style  = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style  = "Regular"

# ── Mouse & Environment ───────────────────────────────────────────────────
[mouse]
hide_when_typing = true

[env]
term = "xterm-256color"
